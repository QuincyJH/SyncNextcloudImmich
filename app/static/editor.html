<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SyncNextcloudImmich — Config Editor</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1.25rem;
           max-width: 920px; margin-inline: auto; }
    h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .75rem; }
    .tabs { display: flex; gap: .25rem; margin-bottom: .5rem; }
    .tab { padding: .4rem .9rem; border: 1px solid #8884; border-bottom: none;
           border-radius: 6px 6px 0 0; cursor: pointer; background: #8881; }
    .tab.active { background: #4f8cff22; border-color: #4f8cff; font-weight: 600; }
    textarea { width: 100%; height: 60vh; font-family: ui-monospace, monospace;
               font-size: 13px; padding: .6rem; border: 1px solid #8884; border-radius: 6px;
               resize: vertical; }
    input[type=password] { flex: 1; min-width: 180px; padding: .4rem .6rem;
               border: 1px solid #8884; border-radius: 6px; font-family: inherit; }
    button { padding: .45rem 1rem; border: 1px solid #4f8cff; background: #4f8cff;
             color: #fff; border-radius: 6px; cursor: pointer; font-size: .9rem; }
    button.secondary { background: transparent; color: inherit; border-color: #8886; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { margin-top: .6rem; padding: .5rem .7rem; border-radius: 6px;
              min-height: 1.2em; font-size: .9rem; white-space: pre-wrap; }
    .ok { background: #22c55e22; }
    .err { background: #ef444422; }
    .warn { font-size: .82rem; opacity: .8; margin-bottom: .5rem; }
    .hint { font-size: .78rem; opacity: .65; margin-top: .3rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Config Editor</h1>

  <div class="row">
    <input id="token" type="password" placeholder="X-Config-Token (CONFIG_API_TOKEN)" autocomplete="off" />
    <label><input id="remember" type="checkbox" /> remember in this browser</label>
  </div>

  <div class="tabs">
    <div class="tab active" data-target="mapping">mapping</div>
    <div class="tab" data-target="user">user_config.json</div>
  </div>

  <div id="mapping-file-row" class="row">
    <label for="mappingFile">Mapping file:</label>
    <select id="mappingFile" style="flex:1; min-width:180px; padding:.4rem .6rem;
            border:1px solid #8884; border-radius:6px; font-family:inherit;"></select>
    <button id="newMapping" class="secondary" type="button">+ New file…</button>
  </div>

  <div id="warn-user" class="warn hidden">
    ⚠ This file contains Immich API tokens. Anyone viewing this screen can read them.
  </div>

  <textarea id="editor" spellcheck="false"></textarea>
  <div class="hint">
    Tab / Shift+Tab indents inside the editor · press Esc then Tab to move focus out ·
    Save reformats the JSON with 2-space indentation.
  </div>

  <div class="row" style="margin-top:.6rem">
    <button id="load">Load</button>
    <button id="validate" class="secondary">Validate JSON</button>
    <button id="save">Save</button>
  </div>
  <div id="status"></div>

<script>
let activeTab = "mapping";
const $ = (id) => document.getElementById(id);

// Resolve the load/save endpoint for the active tab. The mapping tab targets a
// specific named file so each Immich profile can carry its own album->tag rules.
function endpoint() {
  if (activeTab === "user") return "/config/user-config";
  const name = $("mappingFile").value;
  return "/config/mapping-file?name=" + encodeURIComponent(name);
}

// Restore a remembered token.
const saved = localStorage.getItem("configToken");
if (saved) { $("token").value = saved; $("remember").checked = true; }

function setStatus(msg, kind) {
  const el = $("status");
  el.textContent = msg;
  el.className = kind || "";
}

function token() { return $("token").value.trim(); }

function rememberMaybe() {
  if ($("remember").checked) localStorage.setItem("configToken", token());
  else localStorage.removeItem("configToken");
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  activeTab = t.dataset.target;
  $("warn-user").classList.toggle("hidden", activeTab !== "user");
  $("mapping-file-row").classList.toggle("hidden", activeTab !== "mapping");
  $("editor").value = "";
  if (activeTab === "mapping") refreshMappingFiles();
  const label = activeTab === "user" ? "user_config.json" : ($("mappingFile").value || "a mapping file");
  setStatus("Switched to " + label + ". Click Load.", "");
}));

// Populate the mapping-file dropdown from the server (default file + every file
// referenced by user_config), keeping the current selection if still present.
async function refreshMappingFiles() {
  if (!token()) return;
  try {
    const r = await fetch("/config/mapping-files", { headers: { "X-Config-Token": token() } });
    const body = await r.json();
    if (!r.ok) return setStatus("Error " + r.status + ": " + (body.detail || r.statusText), "err");
    const sel = $("mappingFile");
    const prev = sel.value;
    sel.innerHTML = "";
    for (const name of body) {
      const opt = document.createElement("option");
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    }
    if (body.includes(prev)) sel.value = prev;
  } catch (e) { setStatus("Request failed: " + e.message, "err"); }
}

function newMappingFile() {
  let name = prompt("New mapping file name (e.g. mapping-alice.json):", "mapping-.json");
  if (!name) return;
  name = name.trim();
  if (!name.endsWith(".json")) name += ".json";
  const sel = $("mappingFile");
  if (![...sel.options].some(o => o.value === name)) {
    const opt = document.createElement("option");
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  }
  sel.value = name;
  $("editor").value = "{\n  \n}";
  setStatus("New file '" + name + "'. Edit and Save to create it. Reference it via 'mapping_file' in user_config.json.", "");
}

async function load() {
  if (!token()) return setStatus("Enter the config token first.", "err");
  rememberMaybe();
  setStatus("Loading…", "");
  try {
    const r = await fetch(endpoint(), { headers: { "X-Config-Token": token() } });
    const body = await r.json();
    if (!r.ok) return setStatus("Error " + r.status + ": " + (body.detail || r.statusText), "err");
    $("editor").value = JSON.stringify(body, null, 2);
    setStatus("Loaded.", "ok");
  } catch (e) { setStatus("Request failed: " + e.message, "err"); }
}

function parseEditor() {
  try { return { ok: true, data: JSON.parse($("editor").value) }; }
  catch (e) { return { ok: false, error: e.message }; }
}

// Rewrite the editor with canonical 2-space JSON. Returns true if anything changed
// so the caller can mention it. Only ever called with already-parsed data.
function formatEditor(data) {
  const text = JSON.stringify(data, null, 2);
  const ed = $("editor");
  if (ed.value === text) return false;
  ed.value = text;
  return true;
}

// --- Tab-indents-in-the-editor -------------------------------------------
// A textarea normally hands Tab to the browser, which moves focus to the Load
// button mid-edit. Swallow it and indent instead, but keep an escape hatch:
// pressing Esc first restores Tab's usual focus behaviour for keyboard users.
const INDENT = "  ";
let tabEscapes = false;

// Prefer execCommand("insertText") so edits stay on the native undo stack;
// fall back to splicing the value directly where it isn't supported.
function replaceSelection(text, selStart, selEnd) {
  const ed = $("editor");
  ed.setSelectionRange(selStart, selEnd);
  let inserted = false;
  try { inserted = document.execCommand("insertText", false, text); } catch (e) { inserted = false; }
  if (!inserted) {
    const v = ed.value;
    ed.value = v.slice(0, selStart) + text + v.slice(selEnd);
    ed.setSelectionRange(selStart + text.length, selStart + text.length);
  }
}

$("editor").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { tabEscapes = true; return; }
  if (e.key !== "Tab" || e.ctrlKey || e.altKey || e.metaKey) { tabEscapes = false; return; }
  if (tabEscapes) { tabEscapes = false; return; }  // let the browser move focus
  e.preventDefault();

  const ed = $("editor");
  const value = ed.value;
  const start = ed.selectionStart;
  const end = ed.selectionEnd;
  const spansLines = value.slice(start, end).includes("\n");

  // Plain Tab with a caret (or a selection inside one line): just insert indent.
  if (!spansLines && !e.shiftKey) {
    replaceSelection(INDENT, start, end);
    return;
  }

  // Otherwise indent/outdent every line the selection touches.
  const blockStart = value.lastIndexOf("\n", start - 1) + 1;
  const scanFrom = end > start && value[end - 1] === "\n" ? end - 1 : end;
  const nextBreak = value.indexOf("\n", scanFrom);
  const blockEnd = nextBreak === -1 ? value.length : nextBreak;

  const lines = value.slice(blockStart, blockEnd).split("\n").map(line => {
    if (!e.shiftKey) return INDENT + line;
    if (line.startsWith("\t")) return line.slice(1);
    let strip = 0;
    while (strip < INDENT.length && line[strip] === " ") strip++;
    return line.slice(strip);
  });

  const block = lines.join("\n");
  replaceSelection(block, blockStart, blockEnd);
  ed.setSelectionRange(blockStart, blockStart + block.length);
});

function validate() {
  const p = parseEditor();
  if (!p.ok) return setStatus("Invalid JSON: " + p.error, "err");
  setStatus("Valid JSON. (Server will check structure on save.)", "ok");
}

async function save() {
  if (!token()) return setStatus("Enter the config token first.", "err");
  const p = parseEditor();
  if (!p.ok) return setStatus("Invalid JSON, not saving: " + p.error, "err");
  const formatted = formatEditor(p.data);
  rememberMaybe();
  setStatus("Saving…", "");
  try {
    const r = await fetch(endpoint(), {
      method: "PUT",
      headers: { "X-Config-Token": token(), "Content-Type": "application/json" },
      body: JSON.stringify(p.data),
    });
    const body = await r.json();
    if (!r.ok) return setStatus("Save rejected (" + r.status + "): " + (body.detail || r.statusText), "err");
    setStatus("Saved " + (body.file || "") + " ✓" + (formatted ? " (reformatted)" : ""), "ok");
  } catch (e) { setStatus("Request failed: " + e.message, "err"); }
}

$("load").addEventListener("click", load);
$("validate").addEventListener("click", validate);
$("save").addEventListener("click", save);
$("newMapping").addEventListener("click", newMappingFile);

// Prime the mapping-file dropdown if we already have a remembered token.
if (token()) refreshMappingFiles();
</script>
</body>
</html>
